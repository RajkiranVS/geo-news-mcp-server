[project]
name = "geopolitical-news-mcp-server"
version = "0.1.0"
description = "MCP server that fetches geopolitical news headlines from RSS feeds."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.7",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
